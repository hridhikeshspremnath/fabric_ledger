# Attesta SPIRE demo. Trust domain: attesta.example.org (set in conf/*.conf).
# Start with scripts/up.sh, not plain `docker compose up`: the agent needs a
# one-time join token that up.sh generates and injects via JOIN_TOKEN.
name: attesta-spire

services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.3
    command: ["-config", "/etc/spire/server.conf"]
    volumes:
      - ./conf/server.conf:/etc/spire/server.conf:ro
      - server-data:/var/lib/spire/server
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.3
    command: ["-config", "/etc/spire/agent.conf", "-joinToken", "${JOIN_TOKEN:-}"]
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - ./conf/agent.conf:/etc/spire/agent.conf:ro
      - ./.runtime/bootstrap.crt:/etc/spire/bootstrap.crt:ro
      - agent-data:/var/lib/spire/agent
      - agent-socket:/run/spire/sockets
    mem_limit: 96m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/run/spire/sockets/agent.sock"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Workload stand-ins. They share the agent's PID namespace so the agent's
  # `unix` attestor can resolve the caller's PID/UID. Run on demand:
  #   scripts/test-client.sh [ci-runner|scoring-service]
  ci-runner: &workload
    build: ./client
    image: attesta-spire-client:local
    profiles: ["clients"]
    user: "1001"
    pid: "service:spire-agent"
    network_mode: none
    volumes:
      - agent-socket:/run/spire/sockets:ro
    tmpfs: ["/tmp"]
    read_only: true
    cap_drop: ["ALL"]
    mem_limit: 32m

  scoring-service:
    <<: *workload
    user: "1002"

  # Attesta gateway (mTLS, SPIFFE ID spiffe://attesta.example.org/gateway, uid 1003).
  # Start with scripts/gateway-up.sh (uses --no-deps so the agent is untouched).
  gateway:
    build:
      context: ../..
      dockerfile: deploy/spire-demo/gateway/Dockerfile
    image: attesta-spire-gateway:local
    profiles: ["gateway"]
    user: "1003"
    pid: "service:spire-agent"
    environment:
      ATTESTA_GATEWAY_CONFIG: /config/gateway.yaml
      ATTESTA_BACKEND: ${ATTESTA_BACKEND:-sqlite}
    volumes:
      - agent-socket:/run/spire/sockets:ro
      - gateway-data:/data
      - ../../config:/config:ro
      - ./.runtime/scorer_keys.yaml:/run/attesta/scorer_keys.yaml:ro
    tmpfs: ["/tmp"]
    read_only: true
    cap_drop: ["ALL"]
    mem_limit: 192m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8443), 3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Runs as the scoring-service identity (uid 1002) ON the compose network and
  # submits one signed record. Run: scripts/demo-submit.sh
  demo-submit:
    image: attesta-spire-gateway:local
    profiles: ["clients"]
    user: "1002"
    pid: "service:spire-agent"
    command: ["attesta.tools.demo_submit"]
    environment:
      ATTESTA_GATEWAY_CONFIG: /config/gateway.yaml
      GATEWAY_HOST: gateway
      SCORER_KEY_PATH: /run/attesta/scorer-dev-1.key
    volumes:
      - agent-socket:/run/spire/sockets:ro
      - ../../config:/config:ro
      - ./.runtime/scorer-dev-1.key:/run/attesta/scorer-dev-1.key:ro
    tmpfs: ["/tmp"]
    read_only: true
    cap_drop: ["ALL"]
    mem_limit: 96m

  # Fabric bridges (Go). They hold the Fabric identities; CI workloads never do.
  # Start with scripts/bridge-up.sh. Each joins the Fabric network (attesta-fabric)
  # as well as this stack's network, and only accepts one SPIFFE client ID.
  fabric-bridge:
    build:
      context: ../../bridge
    image: attesta-fabric-bridge:local
    profiles: ["fabric"]
    user: "1004"
    pid: "service:spire-agent"
    networks: [default, fabric]
    environment:
      BRIDGE_ROLE: gateway
      BRIDGE_SPIFFE_SOCKET: unix:///run/spire/sockets/agent.sock
      BRIDGE_PEER_ENDPOINT: peer0.attesta.example.com:7051
      BRIDGE_PEER_HOST_ALIAS: peer0.attesta.example.com
      BRIDGE_PEER_TLS_CA: /fabric/tlsca.pem
      BRIDGE_MSP_ID: AttestaMSP
      BRIDGE_CERT_PATH: /fabric/cert.pem
      BRIDGE_KEY_PATH: /fabric/key.pem
    volumes:
      - agent-socket:/run/spire/sockets:ro
      - ../../network/organizations/peerOrganizations/attesta.example.com/peers/peer0.attesta.example.com/tls/ca.crt:/fabric/tlsca.pem:ro
      - ../../network/organizations/peerOrganizations/attesta.example.com/users/User1@attesta.example.com/msp/signcerts/User1@attesta.example.com-cert.pem:/fabric/cert.pem:ro
      - ../../network/organizations/peerOrganizations/attesta.example.com/users/User1@attesta.example.com/msp/keystore/priv_sk:/fabric/key.pem:ro
    read_only: true
    cap_drop: ["ALL"]
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8444"]
      interval: 5s
      timeout: 3s
      retries: 12

  fabric-bridge-auditor:
    build:
      context: ../../bridge
    image: attesta-fabric-bridge:local
    profiles: ["fabric"]
    user: "1005"
    pid: "service:spire-agent"
    networks: [default, fabric]
    environment:
      BRIDGE_ROLE: auditor
      BRIDGE_SPIFFE_SOCKET: unix:///run/spire/sockets/agent.sock
      BRIDGE_PEER_ENDPOINT: peer0.auditor.example.com:7051
      BRIDGE_PEER_HOST_ALIAS: peer0.auditor.example.com
      BRIDGE_PEER_TLS_CA: /fabric/tlsca.pem
      BRIDGE_MSP_ID: AuditorMSP
      BRIDGE_CERT_PATH: /fabric/cert.pem
      BRIDGE_KEY_PATH: /fabric/key.pem
    volumes:
      - agent-socket:/run/spire/sockets:ro
      - ../../network/organizations/peerOrganizations/auditor.example.com/peers/peer0.auditor.example.com/tls/ca.crt:/fabric/tlsca.pem:ro
      - ../../network/organizations/peerOrganizations/auditor.example.com/users/User1@auditor.example.com/msp/signcerts/User1@auditor.example.com-cert.pem:/fabric/cert.pem:ro
      - ../../network/organizations/peerOrganizations/auditor.example.com/users/User1@auditor.example.com/msp/keystore/priv_sk:/fabric/key.pem:ro
    read_only: true
    cap_drop: ["ALL"]
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8444"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Auditor CLI (uid 1006, SPIFFE .../auditor): scripts/auditor-override.sh
  auditor-cli:
    image: attesta-spire-gateway:local
    profiles: ["auditor"]
    user: "1006"
    pid: "service:spire-agent"
    command: ["attesta.tools.auditor_override"]
    environment:
      ATTESTA_GATEWAY_CONFIG: /config/gateway.yaml
    volumes:
      - agent-socket:/run/spire/sockets:ro
      - ../../config:/config:ro
    tmpfs: ["/tmp"]
    read_only: true
    cap_drop: ["ALL"]
    mem_limit: 96m

  # Deploy gate: asks the ledger (through the gateway) whether an artifact digest may
  # deploy. Runs as the CI runner identity (uid 1001): read-only, holds no keys.
  # Run: scripts/deploy-gate.sh sha256:<hex>
  deploy-gate:
    image: attesta-spire-gateway:local
    profiles: ["gate"]
    user: "1001"
    pid: "service:spire-agent"
    command: ["attesta.tools.deploy_gate"]
    environment:
      ATTESTA_GATEWAY_CONFIG: /config/gateway.yaml
      GATEWAY_HOST: gateway
    volumes:
      - agent-socket:/run/spire/sockets:ro
      - ../../config:/config:ro
    tmpfs: ["/tmp"]
    read_only: true
    cap_drop: ["ALL"]
    mem_limit: 96m

  # Scoring service: runs as the scoring-service identity (uid 1002), downloads
  # packages (never installs them), signs TrustRecords and submits to the gateway.
  # HTTP API for CI on 127.0.0.1:8080 (put TLS in front for anything beyond localhost).
  # Start with scripts/scorer-up.sh; one-off scoring with scripts/score.sh.
  scorer: &scorer
    image: attesta-spire-gateway:local
    profiles: ["scoring"]
    user: "1002"
    pid: "service:spire-agent"
    command: ["attesta.scoring.cli", "serve"]
    environment:
      ATTESTA_SCORING_CONFIG: /config/scoring.yaml
      ATTESTA_SCORING_API_TOKEN: ${ATTESTA_SCORING_API_TOKEN:-}
      ATTESTA_SCORING_SCORER_KEY_PATH: /run/attesta/scorer-dev-1.key
      ATTESTA_SCORING_ALLOW_KEY_IN_REPO: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - agent-socket:/run/spire/sockets:ro
      - ../../config:/config:ro
      - ./.runtime/scorer-dev-1.key:/run/attesta/scorer-dev-1.key:ro
    tmpfs: ["/tmp"]
    read_only: true
    cap_drop: ["ALL"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  scorer-cli:
    <<: *scorer
    profiles: ["scoring-cli"]
    command: ["attesta.scoring.cli", "score"]
    ports: []
    healthcheck:
      disable: true

networks:
  fabric:
    external: true
    name: attesta-fabric

volumes:
  gateway-data:
  server-data:
  agent-data:
  agent-socket:
