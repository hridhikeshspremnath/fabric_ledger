agent {
    data_dir = "/var/lib/spire/agent"
    log_level = "INFO"
    trust_domain = "attesta.example.org"
    server_address = "spire-server"
    server_port = 8081
    socket_path = "/run/spire/sockets/agent.sock"
    # Bootstrap trust from the server's bundle (exported by scripts/up.sh),
    # not insecure_bootstrap.
    trust_bundle_path = "/etc/spire/bootstrap.crt"
}

plugins {
    KeyManager "disk" {
        plugin_data {
            directory = "/var/lib/spire/agent"
        }
    }
    NodeAttestor "join_token" {
        plugin_data {}
    }
    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
